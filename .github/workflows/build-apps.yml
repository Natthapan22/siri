name: Build Apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hourly-voice-reminder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean HourlyVoiceReminder.spec
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HourlyVoiceReminder-Windows
          path: hourly-voice-reminder/dist/HourlyVoiceReminder.exe

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: hourly-voice-reminder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean HourlyVoiceReminder.spec
      - name: Zip Mac app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HourlyVoiceReminder.app HourlyVoiceReminder-macOS.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: HourlyVoiceReminder-macOS
          path: hourly-voice-reminder/dist/HourlyVoiceReminder-macOS.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Prepare release files
        run: |
          mkdir -p out
          cp HourlyVoiceReminder-Windows/HourlyVoiceReminder.exe out/
          cp HourlyVoiceReminder-macOS/HourlyVoiceReminder-macOS.zip out/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/HourlyVoiceReminder.exe
            out/HourlyVoiceReminder-macOS.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
